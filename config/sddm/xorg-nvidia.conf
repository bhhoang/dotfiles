Section "Device"
    Identifier "NVIDIA Greeter"
    Driver "nvidia"
    BusID "PCI:1:0:0"
    Option "AllowEmptyInitialConfiguration" "true"
EndSection

Section "Screen"
    Identifier "NVIDIA Greeter Screen"
    Device "NVIDIA Greeter"
    DefaultDepth 24
    SubSection "Display"
        Depth 24
    EndSubSection
EndSection

Section "ServerLayout"
    Identifier "NVIDIA Greeter Layout"
    Screen 0 "NVIDIA Greeter Screen"
EndSection
